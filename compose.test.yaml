services:
  test-db:
    image: postgres:16.6-alpine
    environment:
      POSTGRES_DB: ryadom_test
      POSTGRES_USER: ryadom_test
      POSTGRES_PASSWORD: ryadom_test_only
    ports:
      - "127.0.0.1:55437:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ryadom_test -d ryadom_test"]
      interval: 2s
      timeout: 2s
      retries: 30
    tmpfs:
      - /var/lib/postgresql/data
