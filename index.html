<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f4fbf9">
  <title>Рядом — доска для общих идей</title>
  <link rel="icon" href="assets/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="src/tokens.css">
  <link rel="stylesheet" href="src/board.css">
  <script type="module" src="src/board.js"></script>
</head>
<body>
  <main id="board" aria-label="Доска идей" tabindex="0"><div id="world"><div id="objects"></div><div id="ghosts" aria-hidden="true"></div></div><div id="cursors" aria-hidden="true"></div></main>
  <header class="board-header surface">
    <img src="assets/logo.svg" width="34" height="34" alt="Рядом">
    <div class="board-name"><input id="board-title" maxlength="180" value="Пространство идей" aria-label="Название доски"><span id="save-status" role="status">Открываем доску…</span></div>
    <span class="divider"></span><button class="icon-button" data-action="menu" title="Меню доски" aria-label="Меню доски" aria-expanded="false"><span data-icon="more"></span></button>
    <div id="board-menu" class="popover" hidden>
      <button data-action="export"><span data-icon="download"></span>Скачать доску</button>
      <button data-action="import"><span data-icon="upload"></span>Добавить из файла доски</button>
      <button data-action="theme"><span data-icon="moon"></span>Сменить тему</button>
      <button data-action="help"><span data-icon="help"></span>Управление и клавиши</button>
    </div>
  </header>
  <div class="collaboration surface"><span id="presence"><span class="live-dot"></span>Локальная доска</span><button class="filled-button" data-action="share" aria-label="Совместная работа"><span data-icon="people"></span><span>Совместная работа</span></button></div>
  <nav class="tools surface" aria-label="Инструменты доски">
    <button class="tool active" data-tool="select" aria-label="Выделение" title="Выделение · V" aria-pressed="true"><span data-icon="cursor"></span></button>
    <button class="tool" data-tool="hand" aria-label="Перемещение доски" title="Перемещение · H / Пробел" aria-pressed="false"><span data-icon="hand"></span></button>
    <span class="tool-divider"></span>
    <button class="tool" data-tool="sticky" aria-label="Стикер" title="Стикер · N" aria-pressed="false"><span data-icon="sticky"></span></button>
    <button class="tool" data-tool="text" aria-label="Текст" title="Текст · T" aria-pressed="false"><span data-icon="text"></span></button>
    <button class="tool" data-tool="pen" aria-label="Карандаш" title="Карандаш · P" aria-pressed="false"><span data-icon="pen"></span></button>
    <button class="tool" data-tool="shape" aria-label="Прямоугольник" title="Прямоугольник · R" aria-pressed="false"><span data-icon="square"></span></button>
    <span class="tool-divider"></span>
    <button class="tool" data-action="files" aria-label="Добавить файлы" title="Изображения и документы"><span data-icon="upload"></span></button>
  </nav>
  <div class="selection-tools surface" id="selection-tools" role="group" aria-label="Выбранный объект" hidden>
    <button class="swatch mint" data-color="mint" title="Бирюзовый" aria-label="Бирюзовый"></button>
    <button class="swatch blue" data-color="blue" title="Голубой" aria-label="Голубой"></button>
    <button class="swatch neutral" data-color="neutral" title="Нейтральный" aria-label="Нейтральный"></button>
    <span class="divider"></span>
    <div id="shape-kinds" class="shape-kinds" hidden>
      <button class="icon-button" data-shape-kind="rect" title="Прямоугольник" aria-label="Прямоугольник" aria-pressed="true"><span data-icon="square"></span></button>
      <button class="icon-button" data-shape-kind="ellipse" title="Эллипс" aria-label="Эллипс" aria-pressed="false"><span data-icon="circle"></span></button>
      <button class="icon-button" data-shape-kind="diamond" title="Ромб" aria-label="Ромб" aria-pressed="false"><span data-icon="diamond"></span></button>
      <span class="divider"></span>
    </div>
    <button class="icon-button" data-action="edit" title="Редактировать или скачать" aria-label="Редактировать или скачать"><span data-icon="edit"></span></button>
    <button class="icon-button" data-action="duplicate" title="Копировать объект" aria-label="Копировать объект"><span data-icon="copy"></span></button>
    <button class="icon-button" data-action="delete" title="Удалить · Delete" aria-label="Удалить объект"><span data-icon="trash"></span></button>
  </div>
  <div class="board-hint"><span data-icon="spark"></span><span id="tool-hint">Место, где мысли встречаются</span></div>
  <div class="view-controls surface">
    <button class="icon-button" data-action="undo" aria-label="Отменить" title="Отменить · Ctrl+Z" disabled><span data-icon="undo"></span></button>
    <button class="icon-button" data-action="redo" aria-label="Повторить" title="Повторить · Ctrl+Shift+Z" disabled><span data-icon="redo"></span></button>
    <span class="divider"></span>
    <button class="icon-button" data-action="zoom-out" aria-label="Уменьшить масштаб" title="Уменьшить"><span data-icon="minus"></span></button>
    <button id="zoom" data-action="reset-zoom" title="Масштаб 100%" aria-label="Масштаб 100%">100%</button>
    <button class="icon-button" data-action="zoom-in" aria-label="Увеличить масштаб" title="Увеличить"><span data-icon="plus"></span></button>
    <button class="icon-button" data-action="fit" aria-label="Показать всю доску" title="Показать всё · 1"><span data-icon="fit"></span></button>
  </div>
  <div id="drop-overlay" hidden><div><span data-icon="upload"></span><h2>Положите это на доску</h2><p>Картинки и документы · до 20 МБ на файл</p></div></div>
  <input id="file-input" type="file" multiple accept="image/png,image/jpeg,image/webp,image/gif,.pdf,.doc,.docx,.xls,.xlsx,.ppt,.pptx,.txt,.md,.csv,.odt,.ods,.odp,.rtf" hidden>
  <input id="import-input" type="file" accept=".json,.ryadom" hidden>
  <dialog id="dialog" aria-labelledby="dialog-title"><div id="dialog-content"></div></dialog>
  <div id="toast" role="status" hidden></div>
</body>
</html>
